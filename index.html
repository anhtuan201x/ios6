 <!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iOS 6 Simulator</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;font-family:Helvetica,Arial,sans-serif;color:white;
 background:#111;display:flex;justify-content:center;
 align-items:center;height:100vh
}
#phone{
 width:360px;height:700px;padding:12px;
 border:3px solid #555;border-radius:42px;
 background:#222;box-shadow:0 20px 60px #000
}
#screen{
 height:100%;border-radius:28px;overflow:hidden;
 position:relative;
 background:linear-gradient(150deg,#69b9e8,#244d91,#111b49)
}
#status{
 height:23px;padding:3px 8px;background:#0004;
 display:flex;justify-content:space-between;font-size:12px
}
#apps{
 padding:20px 12px;display:grid;
 grid-template-columns:repeat(4,1fr);gap:24px 8px
}
.app{
 border:0;background:none;color:white;
 font-size:11px;text-shadow:0 1px 3px black;
 display:flex;align-items:center;flex-direction:column;gap:5px;
 cursor:pointer
}
.icon{
 width:55px;height:55px;border-radius:12px;
 border:1px solid #ffffff88;
 background:linear-gradient(#8bd8ff,#0872c5,#06447d);
 box-shadow:inset 0 2px 3px #fff9,0 2px 4px #0008;
 display:grid;place-items:center;font-size:29px
}
.green{background:linear-gradient(#b6ed8b,#249b20)}
.pink{background:linear-gradient(#ffb8dd,#d00069)}
.gray{background:linear-gradient(#ddd,#555)}
#dock{
 position:absolute;bottom:0;width:100%;height:80px;
 display:grid;grid-template-columns:repeat(4,1fr);
 align-items:center;background:#ffffff30;
 border-top:1px solid #ffffff55
}
#appview{
 display:none;position:absolute;inset:23px 0 0;
 background:#f2f2f2;color:#222
}
#nav{
 height:45px;background:linear-gradient(#83c4f2,#205a9e);
 text-align:center;padding:13px;font-weight:bold;color:white
}
#content{padding:15px}
button.action{
 padding:10px 15px;border-radius:6px;
 background:linear-gradient(#65b5ef,#1761a7);
 color:white;border:1px solid #164c80;cursor:pointer
}
#lock{
 position:absolute;inset:0;z-index:5;
 display:flex;flex-direction:column;align-items:center;
 justify-content:space-around;
 background:linear-gradient(#244b80,#83b2db,#243e68)
}
#time{font-size:64px;font-weight:200}
</style>
</head>
<body>
<div id="phone">
<div id="screen">
<div id="lock">
 <div>
  <div id="time">9:41</div>
  <div id="date">Monday</div>
 </div>
 <div style="font-size:45px"></div>
 <button class="action" onclick="unlock()">› Slide to Unlock</button>
</div>
<div id="status">
 <span>Carrier</span><span id="clock">9:41</span>
 <span>▮▮▮ Wi-Fi ▰</span>
</div>
<div id="apps">
<button class="app" onclick="openApp('Messages')"><span class="icon green">✉</span>Messages</button>
<button class="app" onclick="openApp('Calendar')"><span class="icon gray">📅</span>Calendar</button>
<button class="app" onclick="openApp('Photos')"><span class="icon">🌼</span>Photos</button>
<button class="app" onclick="openApp('Camera')"><span class="icon gray">📷</span>Camera</button>
<button class="app" onclick="openApp('Weather')"><span class="icon">☀️</span>Weather</button>
<button class="app" onclick="openApp('Notes')"><span class="icon" style="background:linear-gradient(#fff5a5,#dfbb37)">📝</span>Notes</button>
<button class="app" onclick="openApp('Settings')"><span class="icon gray">⚙️</span>Settings</button>
<button class="app" onclick="openApp('Cydia')"><span class="icon">◉</span>Cydia</button>
</div>
<div id="dock">
<button class="app" onclick="openApp('Phone')"><span class="icon green">☎</span>Phone</button>
<button class="app" onclick="openApp('Mail')"><span class="icon">✉</span>Mail</button>
<button class="app" onclick="openApp('Safari')"><span class="icon">🧭</span>Safari</button>
<button class="app" onclick="openApp('Music')"><span class="icon pink">♫</span>Music</button>
</div>
<div id="appview">
 <div id="nav"><button onclick="home()" style="float:left">‹ Home</button><span id="title">App</span></div>
 <div id="content"></div>
</div>
</div>
</div>
<script>
function unlock(){
 document.getElementById('lock').style.display='none';
}
function updateClock(){
 let d=new Date(),h=d.getHours()%12||12;
 let m=String(d.getMinutes()).padStart(2,'0');
 document.getElementById('clock').textContent=h+':'+m;
 document.getElementById('time').textContent=h+':'+m;
 document.getElementById('date').textContent=
 d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}
setInterval(updateClock,1000);updateClock();

function openApp(name){
 document.getElementById('apps').style.display='none';
 document.getElementById('dock').style.display='none';
 document.getElementById('appview').style.display='block';
 document.getElementById('title').textContent=name;
 let c=document.getElementById('content');
 if(name==='Safari'){
 c.innerHTML='<h3>Safari</h3><input id="url" placeholder="Website address" style="width:100%;padding:10px"><button class="action" onclick="go()">Go</button>';
 }else if(name==='Notes'){
 c.innerHTML='<h3>Notes</h3><textarea id="note" rows="8" style="width:100%"></textarea><button class="action" onclick="saveNote()">Save</button>';
 }else if(name==='Settings'){
 c.innerHTML='<h3>Settings</h3><p>Wi-Fi　　On</p><hr><p>Bluetooth　 Off</p><hr><p>General</p><hr><p>Wallpaper</p>';
 }else if(name==='Phone'){
 c.innerHTML='<h3>Phone</h3><input id="number" placeholder="Phone number" style="width:100%;padding:10px"><p><button class="action" onclick="alert(\'Demo only — no real call\')">Call</button></p>';
 }else{
 c.innerHTML='<h3>'+name+'</h3><p>Welcome to the iOS 6 web simulator.</p><p>This app is simulated.</p>';
 }
}
function home(){
 document.getElementById('appview').style.display='none';
 document.getElementById('apps').style.display='grid';
 document.getElementById('dock').style.display='grid';
}
function go(){
 let u=document.getElementById('url').value.trim();
 if(!u)return;
 if(!/^https?:\/\//i.test(u))u='https://'+u;
 window.open(u,'_blank','noopener');
}
function saveNote(){
 try{
 localStorage.setItem('ios6-note',document.getElementById('note').value);
 alert('Note saved!');
 }catch(e){alert('Could not save note');}
}
</script>
</body>
</html>
