<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>iOS 6 Web Simulator</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Helvetica,Arial,sans-serif;background:#111;color:white;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,#555,#111 70%)}
#device{width:min(390px,96vw);height:min(780px,96vh);background:linear-gradient(110deg,#222,#050505 18%,#292929 22%,#080808 80%,#333);border:3px solid #555;border-radius:42px;padding:14px;box-shadow:0 25px 70px #000;position:relative}
#screen{height:100%;width:100%;overflow:hidden;border-radius:28px;position:relative;background:#547bb3}
#speaker{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:54px;height:5px;background:#050505;border-radius:8px}
#camera{position:absolute;top:4px;left:27%;width:7px;height:7px;background:#111;border:1px solid #444;border-radius:50%}
#homebtn{position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);height:34px;width:34px;border:2px solid #555;border-radius:50%;background:linear-gradient(#222,#050505);cursor:pointer}
#status{height:22px;background:rgba(0,0,0,.24);font-size:12px;font-weight:bold;padding:3px 8px;display:flex;justify-content:space-between;text-shadow:0 1px #000}
#status .right{letter-spacing:1px}
#wallpaper{position:absolute;inset:22px 0 0;background:linear-gradient(150deg,#5da6d9,#1a3f83 50%,#14204e);background-size:cover}
#wallpaper:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 20% 10%,#ffffff55,transparent 35%),linear-gradient(130deg,transparent 40%,#ffffff13 41%,transparent 60%)}
#pages{position:absolute;inset:0;padding:12px 10px 76px;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:86px;gap:8px 5px;align-content:start}
.app{display:flex;align-items:center;flex-direction:column;gap:5px;border:0;background:none;color:#fff;font-size:11px;text-shadow:0 1px 3px #000;cursor:pointer;min-width:0}
.icon{width:53px;height:53px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:29px;border:1px solid #ffffff77;box-shadow:inset 0 1px 2px #fff8,0 2px 4px #0008;background:linear-gradient(#78c9ff,#0875c8 50%,#064c9c);position:relative}
.icon:after{content:"";position:absolute;top:2px;left:3px;right:3px;height:42%;border-radius:9px;background:linear-gradient(#fff7,#fff0)}
.i-phone{background:linear-gradient(#a8e36c,#2c9c16)}.i-safari{background:linear-gradient(#d8f5ff,#1683d8)}.i-messages{background:linear-gradient(#c4f49b,#40a51f)}.i-music{background:linear-gradient(#ffb8dc,#d50071)}.i-settings{background:linear-gradient(#ddd,#555)}.i-photos{background:linear-gradient(#fff,#ddd)}.i-camera{background:linear-gradient(#aaa,#333)}.i-cydia{background:linear-gradient(#75e8ef,#0079aa)}
#dock{position:absolute;bottom:0;left:0;right:0;height:72px;padding:7px 10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:linear-gradient(#ffffff4d,#ffffff15 30%,#0005);border-top:1px solid #ffffff44}
#dock .icon{width:48px;height:48px}
#dock .app{font-size:10px}
#appview{display:none;position:absolute;inset:22px 0 0;background:#f2f2f2;color:#111}
.nav{height:43px;background:linear-gradient(#8fc5ef,#3476b9 48%,#1e5b9e);color:white;text-align:center;font-weight:bold;padding:12px 50px;text-shadow:0 -1px #345;border-bottom:1px solid #234;position:relative}
.back{position:absolute;left:7px;top:7px;padding:5px 9px;color:white;border:1px solid #174878;border-radius:6px;background:linear-gradient(#75b4e7,#2862a3);font-size:12px;cursor:pointer}
.content{padding:14px;overflow:auto;height:calc(100% - 43px);font-size:14px}
.rowitem{padding:12px;background:white;border-bottom:1px solid #ccc;cursor:pointer}
.panel{background:white;border:1px solid #ccc;border-radius:8px;padding:12px;margin-bottom:12px}
input,textarea{font:inherit;padding:8px;border:1px solid #aaa;border-radius:5px;width:100%;margin:5px 0}
button.blue{background:linear-gradient(#69b5ef,#1764ad);color:white;border:1px solid #17538e;border-radius:6px;padding:9px 13px;cursor:pointer}
#toast{position:absolute;top:30px;left:10%;width:80%;background:#222e;color:white;padding:10px;border-radius:8px;text-align:center;display:none;z-index:5}
#lock{position:absolute;inset:0;background:linear-gradient(#244b80,#83b2db 48%,#243e68);z-index:8;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:55px 18px 30px;text-align:center}
#locktime{font-size:64px;font-weight:200;text-shadow:0 2px 4px #234}
#lockdate{font-size:18px;margin-top:-8px}
#unlock{border:1px solid #ffffff99;border-radius:22px;padding:10px 28px;background:linear-gradient(#ffffff55,#00000022);color:white;cursor:pointer}
#lockhint{font-size:12px;color:#eee}
@media(max-height:600px){#device{height:96vh;width:min(300px,96vw);border-radius:30px;padding:10px}#screen{border-radius:20px}#pages{grid-auto-rows:65px;padding:8px 7px 65px}.icon{width:42px;height:42px;font-size:23px}.app{font-size:9px}#dock{height:59px}#dock .icon{width:38px;height:38px}#locktime{font-size:48px}}
</style>
</head>
<body>
<div id="device">
 <div id="speaker"></div><div id="camera"></div>
 <div id="screen">
  <div id="wallpaper"></div>
  <div id="status"><span id="carrier">Carrier</span><span id="clock">9:41</span><span class="right">▮▮▮  Wi-Fi ▰</span></div>
  <div id="pages">
   <button class="app" onclick="openApp('Messages')"><span class="icon i-messages">✉</span><span>Messages</span></button>
   <button class="app" onclick="openApp('Calendar')"><span class="icon" style="background:linear-gradient(#fff,#ddd);color:#d22;font-size:12px">MON<br><b style="font-size:24px;color:#222">26</b></span><span>Calendar</span></button>
   <button class="app" onclick="openApp('Photos')"><span class="icon i-photos">🌼</span><span>Photos</span></button>
   <button class="app" onclick="openApp('Camera')"><span class="icon i-camera">📷</span><span>Camera</span></button>
   <button class="app" onclick="openApp('Weather')"><span class="icon">☀️</span><span>Weather</span></button>
   <button class="app" onclick="openApp('Clock')"><span class="icon" style="background:linear-gradient(#fff,#aaa);color:#222">◷</span><span>Clock</span></button>
   <button class="app" onclick="openApp('Maps')"><span class="icon" style="background:linear-gradient(#b5e6a3,#73bd70)">🗺️</span><span>Maps</span></button>
   <button class="app" onclick="openApp('Videos')"><span class="icon" style="background:linear-gradient(#bbb,#555)">▶</span><span>Videos</span></button>
   <button class="app" onclick="openApp('Notes')"><span class="icon" style="background:linear-gradient(#fff6a6,#e6c85a);color:#333">▤</span><span>Notes</span></button>
   <button class="app" onclick="openApp('Reminders')"><span class="icon" style="background:linear-gradient(#fff,#ddd);color:#444">☷</span><span>Reminders</span></button>
   <button class="app" onclick="openApp('Settings')"><span class="icon i-settings">⚙</span><span>Settings</span></button>
   <button class="app" onclick="openApp('Cydia')"><span class="icon i-cydia">◉</span><span>Cydia</span></button>
  </div>
  <div id="dock">
   <button class="app" onclick="openApp('Phone')"><span class="icon i-phone">☎</span><span>Phone</span></button>
   <button class="app" onclick="openApp('Mail')"><span class="icon">✉</span><span>Mail</span></button>
   <button class="app" onclick="openApp('Safari')"><span class="icon i-safari">🧭</span><span>Safari</span></button>
   <button class="app" onclick="openApp('Music')"><span class="icon i-music">♫</span><span>Music</span></button>
  </div>
  <div id="appview"><div class="nav"><button class="back" onclick="home()">‹ Home</button><span id="apptitle">App</span></div><div class="content" id="appcontent"></div></div>
  <div id="toast"></div>
  <div id="lock"><div><div id="locktime">9:41</div><div id="lockdate">Monday, October 26</div></div><div style="font-size:40px;text-shadow:0 2px 4px #123"></div><div id="lockhint">slide to unlock</div><button id="unlock" onclick="unlockPhone()">› &nbsp; Slide to Unlock</button></div>
 </div>
 <button id="homebtn" aria-label="Home" onclick="home()"></button>
</div>
<script>
const $=id=>document.getElementById(id);
function updateClock(){let d=new Date();let h=d.getHours(),m=String(d.getMinutes()).padStart(2,'0');$('clock').textContent=(h%12||12)+':'+m;$('locktime').textContent=(h%12||12)+':'+m;$('lockdate').textContent=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});}
updateClock();setInterval(updateClock,15000);
function unlockPhone(){$('lock').style.display='none';}
function home(){$('appview').style.display='none';$('pages').style.display='grid';$('dock').style.display='grid';$('wallpaper').style.display='block';}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1800);}
function openApp(name){
 $('pages').style.display='none';$('dock').style.display='none';$('wallpaper').style.display='none';$('appview').style.display='block';$('apptitle').textContent=name;
 let c=$('appcontent'), body='';
 const panel=(s)=>'<div class="panel">'+s+'</div>';
 if(name==='Safari') body=panel('<b>Safari</b><p>Enter a website address</p><input id="weburl" value="https://www.example.com"><button class="blue" onclick="browse()">Go</button><div id="webresult" style="margin-top:12px">Your web page will open here.</div>');
 else if(name==='Notes') body=panel('<b>Notes</b><textarea id="note" rows="9" placeholder="Type your note..."></textarea><button class="blue" onclick="saveNote()">Save Note</button><p id="notesaved"></p>');
 else if(name==='Settings') body='<div class="rowitem" onclick="toast(\'Wi-Fi: connected (simulated)\')">📶 Wi-Fi <span style="float:right;color:#777">›</span></div><div class="rowitem" onclick="toast(\'Bluetooth is off\')">Bluetooth <span style="float:right;color:#777">›</span></div><div class="rowitem" onclick="wallpaper()">Wallpaper <span style="float:right;color:#777">›</span></div><div class="rowitem" onclick="toast(\'iOS 6 Web Simulator · Demo\')">General → About <span style="float:right;color:#777">›</span></div>';
 else if(name==='Phone') body=panel('<div style="text-align:center;font-size:28px;color:#555" id="dial"> </div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">'+['1','2','3','4','5','6','7','8','9','*','0','#'].map(n=>'<button class="blue" onclick="dial(\''+n+'\')">'+n+'</button>').join('')+'</div><p style="text-align:center"><button class="blue" onclick="toast(\'Demo call — no real call placed\')">Call</button> <button onclick="$(\\'dial\\').textContent=\\'\\'">Clear</button></p>');
 else if(name==='Messages') body=panel('<b>New Message</b><input placeholder="To:"><textarea rows="4" placeholder="iMessage"></textarea><button class="blue" onclick="toast(\'Demo message only\')">Send</button><p style="color:#777">Messages are simulated; nothing is sent.</p>');
 else if(name==='Calendar') body=panel('<h2>Monday 26</h2><p>October 2026</p><hr><p>No events today.</p>');
 else if(name==='Clock') body=panel('<h2 id="clockbig">9:41</h2><p>World Clock · Alarm · Stopwatch · Timer</p><button class="blue" onclick="toast(\'Alarm set (demo)\')">＋ Alarm</button>');
 else if(name==='Weather') body=panel('<h2>☀️ 28°</h2><p>Sunny · Tay Ninh (demo)</p><p>H: 31° &nbsp; L: 24°</p>');
 else if(name==='Maps') body=panel('<h2>🗺️ Maps</h2><p>Map view is simulated.</p><input placeholder="Search Maps"><button class="blue" onclick="toast(\'Search demo\')">Search</button>');
 else if(name==='Camera') body=panel('<div style="height:220px;background:linear-gradient(#a9c8e5,#eee);display:grid;place-items:center;font-size:50px">📷</div><p style="text-align:center"><button class="blue" onclick="toast(\'Photo captured (demo)\')">● Capture</button></p>');
 else if(name==='Photos') body=panel('<h2>Photos</h2><div style="height:140px;background:linear-gradient(135deg,#8fc8ff,#ffd5e6,#fff1a3);display:grid;place-items:center;font-size:50px">🌈</div><p>Sample photo · Camera Roll</p>');
 else if(name==='Music') body=panel('<div style="text-align:center;font-size:52px">♫</div><h3 style="text-align:center">iPod Music</h3><p style="text-align:center">No songs in Library</p><button class="blue" onclick="toast(\'No music loaded\')">Play</button>');
 else if(name==='Mail') body=panel('<h2>Mailboxes</h2><div class="rowitem" onclick="toast(\'Inbox is empty\')">Inbox ›</div><div class="rowitem">Drafts ›</div><p>Mail is a demo.</p>');
 else if(name==='Cydia') body=panel('<h2 style="color:#2374a5">Cydia</h2><p>Welcome to the simulated package manager.</p><div class="rowitem" onclick="toast(\'No packages available in demo\')">Featured Packages ›</div><div class="rowitem" onclick="toast(\'Sources are simulated\')">Manage Sources ›</div><p>Does not install real tweaks.</p>');
 else if(name==='Videos') body=panel('<h2>Videos</h2><p>No videos in Library.</p>');
 else if(name==='Reminders') body=panel('<h2>Reminders</h2><input id="reminder" placeholder="New reminder"><button class="blue" onclick="addReminder()">Add</button><div id="reminders"></div>');
 else body=panel(name+' — demo app');
 c.innerHTML=body;
}
function browse(){let u=$('weburl').value.trim();if(!u)return;if(!/^https?:\/\//i.test(u))u='https://'+u;$('webresult').innerHTML='<p>Open in a new browser tab:</p><a target="_blank" rel="noopener" href="'+u.replace(/"/g,'&quot;')+'">'+u.replace(/</g,'&lt;')+'</a><p style="color:#777">For safety, the website opens outside this simulated Safari.</p>';}
function saveNote(){try{localStorage.setItem('ios6-note',$('note').value);$('notesaved').textContent='Saved on this browser.'}catch(e){$('notesaved').textContent='Could not save.'}}
function dial(n){$('dial').textContent+=n}
function wallpaper(){let colors=['linear-gradient(150deg,#5da6d9,#1a3f83 50%,#14204e)','linear-gradient(140deg,#e99b9b,#5c2c70,#171c54)','linear-gradient(140deg,#78d8c8,#237b9c,#15294d)','linear-gradient(140deg,#f5d58c,#d46d50,#6b244b)'];let i=Number(localStorage.getItem('ios6-wall')||0);i=(i+1)%colors.length;localStorage.setItem('ios6-wall',i);$('wallpaper').style.background=colors[i];toast('Wallpaper changed');}
function addReminder(){let v=$('reminder').value.trim();if(v){let d=document.createElement('div');d.className='rowitem';d.textContent='☐ '+v;$('reminders').appendChild(d);$('reminder').value='';}}
document.addEventListener('keydown',e=>{if(e.key==='Escape')home()});
</script>
</body></html>
